name: Alpha

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  alpha:
    runs-on: ubuntu-latest
    if: github.repository == 'playcanvas/engine' && github.ref_name != 'main'
    steps:
      - name: Generate app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_KEY }}

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Set up Node.js 24.x
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.x
          cache: "npm"

      - name: Configure Git User
        run: |
          git config --global user.email "playcanvas[bot]@users.noreply.github.com"
          git config --global user.name "PlayCanvas [bot]"
        shell: bash

      - name: Tag alpha
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          base=$(npm pkg get version | sed 's/"//g' | sed 's/-.*//')
          pr=$(gh pr view "$GITHUB_REF_NAME" --json number --jq .number 2>/dev/null || true)
          version="$base-alpha.${pr:-$GITHUB_RUN_NUMBER}.${GITHUB_RUN_NUMBER}"
          npm version "$version" --no-git-tag-version
          git commit -m "Alpha $version" -- package.json package-lock.json
          git tag "v$version"
          git push origin "v$version"
